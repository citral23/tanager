---
name: tanager
description: An obscure red bird.

base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /
      - source: usr/lib/firmware
        destination: /usr/lib/firmware

  - type: bling
    install:
        - rpmfusion

  - type: dnf
    repos:
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
      copr:
        - lionheartp/Hyprland 
        - lizardbyte/beta
    install:
      packages:
        - brave-origin
        - brightnessctl
        - btop
        - cargo
        - cava
        - chezmoi
        - cliphist
        - ddcutil
        - dialog
        - eog
        - fastfetch
        - fira-code-fonts
        - freerdp
        - gamescope
        - gnome-calculator
        - gnome-clocks
        - gparted
        - gstreamer1-plugins-ugly
        - ImageMagick
        - intel-media-driver
        - jetbrainsmono-nerd-fonts
        - kitty
        - libvirt
        - mangohud
        - mediawriter
        - mesa-va-drivers-freeworld
        - mesa-vulkan-drivers-freeworld
        - mpv
        - mpv-devel
        - niri
        - nmap-ncat
        - noctalia-shell-legacy
        - papers
        - python3-pip
        - qemu
        - qt6ct
        - screen
        - steam
        - sunshine
        - tailscale
        - telnet
        - virt-manager
        - wlsunset
        - xdotool
        - xwininfo
        - yad
        - yazi
        - zed

    remove:
      packages:
        - htop
        - gnome-software
        - gnome-system-monitor

  - type: akmods
    install:
      - xone

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - com.ranfdev.DistroShelf
          - io.github.flattool.Ignition
          - org.gtk.Gtk3theme.adw-gtk3
          - org.gtk.Gtk3theme.adw-gtk3-dark
          - org.remmina.Remmina
          - page.codeberg.libre_menu_editor.LibreMenuEditor
          - io.github.kolunmi.Bazaar
          - io.missioncenter.MissionCenter
          - com.github.tchx84.Flatseal
          - org.atheme.audacious
          - page.tesk.Refine

  - type: signing

  - type: systemd
    system:
      enabled:
        - tailscaled
        - libvirtd
        - sshd

  - type: kargs
    kargs:
      - split_lock_detect=off
